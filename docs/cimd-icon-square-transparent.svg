    Row 2: I M / > < C I
    Row 3: M / > < C I M       (wait, sketch says M /> < C I M)
    Row 4: / > < C I M /
    Row 5: > < C i m D *       (identity/wrap, lowercase = ghost)
    Row 6: * C I m d / >       (ghost row)
    Row 7: < / C I M D >       (closing tag)

    Tokens: < C I M D / >  (7, Z/7Z)
